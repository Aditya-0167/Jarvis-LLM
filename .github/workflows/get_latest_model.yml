name: Generate 7GB Model Backup Link
on:
  workflow_dispatch:

jobs:
  package-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch 7.63GB Cache State
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            checkpoints
            generations
            workspace
          key: jarvis-continuous-main-129

      - name: Verify Footprint & Folder Structure
        run: |
          echo "=== Freeing up runner workspace space ==="
          rm -rf ~/.cache/pip || true
          
          echo "=== Verifying retrieved folders ==="
          ls -d data checkpoints generations workspace || echo "One or more core directories are still missing"
          
          echo "=== Listing checkpoints ==="
          ls -lh checkpoints/ || echo "No checkpoints found inside directory"

      - name: Package Into Single Zip File
        run: |
          echo "=== Compressing data structures ==="
          # Zip the exact directories mapping the cache path definitions
          zip -1 -r jarvis_latest_7GB_model_backup.zip data checkpoints generations workspace

      - name: Generate Web Download Link
        uses: actions/upload-artifact@v4
        with:
          name: Full-Latest-Model-7GB-Zip
          path: jarvis_latest_7GB_model_backup.zip
          retention-days: 90
